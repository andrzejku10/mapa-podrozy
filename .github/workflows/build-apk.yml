# Buduje plik APK automatycznie na serwerach GitHuba (za darmo).
name: Zbuduj APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Zależności systemowe
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip patch lbzip2 autoconf automake \
            autopoint gettext libtool libltdl-dev pkg-config cmake \
            zlib1g-dev libncurses-dev libtinfo6 libffi-dev libssl-dev

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer "cython<3" setuptools

      # Działa także wtedy, gdy pliki trafiły do podfolderu repozytorium
      - name: Znajdź projekt
        id: projekt
        run: |
          SPEC=$(find . -name buildozer.spec -not -path "*/.buildozer/*" | head -n 1)
          if [ -z "$SPEC" ]; then
            echo "::error::Nie ma pliku buildozer.spec - wgraj wszystkie pliki projektu."
            exit 1
          fi
          echo "dir=$(dirname "$SPEC")" >> "$GITHUB_OUTPUT"
          echo "Projekt jest w folderze: $(dirname "$SPEC")"

      - name: Pamięć podręczna Android SDK/NDK
        uses: actions/cache@v6
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}

      - name: Budowanie APK
        working-directory: ${{ steps.projekt.outputs.dir }}
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # Gdy coś pójdzie nie tak: tu jest końcówka logu z przyczyną błędu
      - name: Pokaż błąd
        if: failure()
        run: tail -n 80 "$GITHUB_WORKSPACE/build.log" || true

      - name: Zapisz pełny log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: log-budowania
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: MapaPodrozy-apk
          path: ${{ steps.projekt.outputs.dir }}/bin/*.apk
