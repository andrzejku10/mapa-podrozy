name: Zbuduj APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zależności systemowe
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev automake autopoint gettext

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer "cython<3" setuptools

      - name: Pamięć podręczna Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Budowanie APK
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: MapaPodrozy-apk
          path: bin/*.apk
